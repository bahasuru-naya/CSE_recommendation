<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7" />
    </linearGradient>

    <!-- Main Alpha Swoosh Gradient -->
    <linearGradient id="alphaGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="30%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Accent Golden Sparkle Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Grid Ambient Accent -->
  <circle cx="48" cy="16" r="14" fill="#3b82f6" fill-opacity="0.12" filter="blur(6px)" />
  <circle cx="16" cy="48" r="12" fill="#10b981" fill-opacity="0.12" filter="blur(6px)" />

  <!-- 3 Ascending Momentum Bars (Data Lakehouse -> ML Alpha) -->
  <rect x="18" y="38" width="3.5" height="10" rx="1.5" fill="#10b981" fill-opacity="0.65" />
  <rect x="24.5" y="32" width="3.5" height="16" rx="1.5" fill="#06b6d4" fill-opacity="0.75" />
  <rect x="31" y="25" width="3.5" height="23" rx="1.5" fill="#3b82f6" fill-opacity="0.85" />

  <!-- Stylized Greek Alpha (α) merged with Breakout Arrow -->
  <!-- Back loop shadow/glow -->
  <path
    d="M 46 22 C 40 38 34 46 25 46 C 17 46 12 40 12 32 C 12 23 18 17 26 17 C 33 17 39 23 44 32 L 50 14"
    stroke="#38bdf8"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.25"
  />

  <!-- Main Radiant Alpha Line -->
  <path
    d="M 46 22 C 40 38 34 46 25 46 C 17 46 12 40 12 32 C 12 23 18 17 26 17 C 33 17 39 23 44 32 L 50 14"
    stroke="url(#alphaGrad)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Breakout Arrow Head at Top Right -->
  <path
    d="M 42 14 L 50 14 L 50 22"
    stroke="url(#alphaGrad)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Golden Alpha Sparkle / Target Profit Star -->
  <path
    d="M 52 11 Q 52 7 50 7 Q 52 7 52 3 Q 52 7 54 7 Q 52 7 52 11 Z"
    fill="url(#goldGrad)"
  />
  <circle cx="52" cy="7" r="1" fill="#ffffff" />
</svg>
